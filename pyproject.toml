[project]
name = "xatu-analysis"
version = "0.1.0"
description = "Xatu data analysis toolkit with ClickHouse and Parquet support"
readme = "README.md"
authors = [
    { name = "Sam Calder-Mason", email = "sam@puritydev.io" }
]
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.28.0",
    "clickhouse-connect>=0.7.0",
    "pandas>=2.0.0",
    "pyarrow>=10.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.21.0",
    "sqlalchemy>=1.4.0",
    "clickhouse-sqlalchemy>=0.2.0",
    "requests>=2.25.0",
]

[project.scripts]
xatu-analysis = "xatu_analysis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
